<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixi</title>
  <!-- Link previews (Discord, Slack, social) need absolute URLs; the crawlers do not run the app, so the tags live here. -->
  <meta name="description" content="Drop in an image and get a seven-color palette, ordered, named and ready to export. Runs in your browser; nothing is uploaded.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="PIXI: Picture to Palette">
  <meta property="og:description" content="Drop in an image and get a seven-color palette, ordered, named and ready to export. Runs in your browser; nothing is uploaded.">
  <meta property="og:url" content="https://xanderstagwood.github.io/pixi/">
  <meta property="og:image" content="https://xanderstagwood.github.io/pixi/link-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="carousel"><div id="track"></div></div>

  <div id="stage-frame" hidden><div id="stage"><canvas></canvas></div></div>
  <div id="counter" hidden></div>
  <div id="version"><span class="tag-icon"><span class="icon icon--pixi"></span></span><span class="tag-label" id="version-label"></span><button class="tag-btn" data-url="https://github.com/xanderstagwood/pixi/issues/new" title="Report an issue." aria-label="Report an issue"><span class="icon icon--bug"></span></button><button class="tag-btn tag-btn--heart" data-url="https://ko-fi.com/xanderstagwood" title="Become a supporter. (Kofi)" aria-label="Become a supporter"><span class="icon icon--heart"></span></button></div>
  <div id="scanners"></div>
  <div id="stack-host"></div>
  <input id="file" type="file" accept="image/*" multiple hidden>

  <script type="module" src="src/main.js"></script>
</body>
</html>
